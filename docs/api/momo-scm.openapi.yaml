        orderD:
          type: string
          description: 訂單細節序號
        orderG:
          type: string
          description: 訂單商品序號
        orderNo:
          type: string
          description: 訂單編號
        orderW:
          type: string
          description: 訂單處理序號
        sendRecoverType:
          type: string
        toDate:
          description: 結案日期迄日
          type: string
      required:
        - loginInfo
        - fromDate
        - toDate
        - delyGbType
        - sendRecoverType
      type: object
    OrderQueryResponse:
      properties:
        BUY_PRICE:
          type: integer
        BUY_PRICE_REDUCE_VAT:

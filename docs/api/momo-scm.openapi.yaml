openapi: 3.0.3
info:
  description: 完整萃取自規格書的 API 呼叫與回傳格式
  title: momo SCM 後台管理系統 - 廠商 API
  version: 1.0.0
servers:
  - url: https://scmapi.momoshop.com.tw
    description: momo SCM API 伺服器
tags:
  - name: 訂單
    description: 訂單查詢、出貨、回收、取貨門市與回收聯單作業。
  - name: 商品
    description: 商品提報、查詢、庫存與上下架作業。
  - name: 商品異動
    description: 商品價格、屬性、規格、贈品與其他資料異動作業。
  - name: 商品編碼
    description: 商品分類、品牌、館架與其他編碼查詢。
  - name: 寄倉
    description: 寄倉入庫、退倉、庫存、採購與通知作業。
  - name: 商談
    description: SCM 商談查詢、讀取與回覆作業。
  - name: 聯絡 momo
    description: 出貨、回收與售後問題的聯絡 momo 作業。
  - name: 問問
    description: momo 問問訊息、標記與常用訊息作業。
  - name: 帳務
    description: 對帳與款項明細查詢。
components:
  schemas:
    AppliedListRequest:
      properties:
        dateFlag:
          type: string
        entpGoodsNo:
          type: string
        fromDate:
          type: string
        goodsCode:
          type: string
        goodsName:
          type: string
          description: 商品名稱
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        mdId:
          type: string
          description: MD編號
        pFlag:
          type: string
          description: 狀態
        toDate:
          type: string
        whCode:
          type: string
      type: object
    AppliedListResponse:
      properties:
        ENTP_GOODS_NO:
          type: string
        EOUT_NOTE:
          type: string
        EOUT_PLAN_DATE:
          type: string
        EOUT_QUEST_NO:
          type: string
        EOUT_QUEST_QTY:
          type: integer
        GOODSDT_CODE:
          type: string
        GOODSDT_INFO:
          type: string
        GOODS_CODE:
          type: string
        GOODS_NAME:
          type: string
        PM_USER:
          type: string
          description: 負責PM
        P_FAIL_NOTE:
          type: string
          description: 退件原因
        P_FLAG:
          type: string
          description: 狀態
        TMP_EOUT_QUEST_NO:
          type: string
          description: 申請編號
        USER_NAME:
          type: string
        WH_NAME:
          type: string
      type: object
    ApplyReturnRequest:
      properties:
        EOUT_NOTE:
          type: string
        EOUT_QUEST_QTY:
          type: string
        GOODSDT_CODE:
          type: string
        GOODS_CODE:
          type: string
        WH_CODE:
          type: string
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
      type: object
    BackToGoodsRequest:
      properties:
        fromDate:
          type: string
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        toDate:
          type: string
      type: object
    BackToGoodsResponseItem:
      properties:
        ENTP_GOODS_NO:
          type: string
        GOODSDT_CODE:
          type: string
        GOODSDT_INFO:
          type: string
        GOODS_CODE:
          type: string
        GOODS_NAME:
          type: string
        GRADE_CTRL_DATE:
          type: string
          description: 調整日期
        GRADE_CTRL_NO:
          type: string
          description: 調整單號
        GRADE_CTRL_QTY:
          type: integer
          description: 調整數量
        WH_CODE:
          type: string
      type: object
    CanApplyListRequest:
      properties:
        canQty:
          type: string
          description: 良品可賣量
        goodsCode:
          type: string
        goodsName:
          type: string
          description: 商品名稱
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        mdId:
          type: string
          description: MD編號
        op:
          type: string
        whCode:
          type: string
      type: object
    CanApplyListResponse:
      properties:
        CAN_QTY:
          type: integer
          description: 良品可賣量
        GOODSDT_CODE:
          type: string
        GOODSDT_INFO:
          type: string
        GOODS_CODE:
          type: string
        GOODS_NAME:
          type: string
        PM_USER:
          type: string
          description: 負責PM
        PRE_QTY:
          type: integer
          description: 型錄保留量
        USER_NAME:
          type: string
        WH_NAME:
          type: string
      type: object
    CounselResponse:
      properties:
        ERROR:
          type: string
        message:
          type: string
          description: 執行結果訊息
        success:
          type: boolean
      type: object
    ErrorResponse:
      properties:
        ERROR:
          type: string
      type: object
    HistoryReturnRequest:
      properties:
        entpGoodsNo:
          type: string
        eoutQuestNo:
          type: string
        fromDate:
          type: string
        goodsCode:
          type: string
        goodsName:
          type: string
          description: 商品名稱
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        toDate:
          type: string
        whCode:
          type: string
      type: object
    HistoryReturnResponse:
      properties:
        dataList:
          items:
            properties:
              buyAmt:
                type: string
                description: 資料明細
              buyCost:
                type: string
                description: 單價(未稅)
              entpGoodsNo:
                type: string
              eoutBqty:
                type: string
                description: 退倉數量
              eoutDate:
                type: string
                description: 退貨日期
              eoutNo:
                type: string
                description: 送回編號
              eoutNote:
                type: string
                description: 退倉原由
              eoutQuestNo:
                type: string
              goodsCode:
                type: string
              goodsName:
                type: string
                description: 商品名稱
              goodsdtCode:
                type: string
                description: 單品編號
              goodsdtInfo:
                type: string
                description: 單品詳細
              groupGoodsYn:
                type: string
                description: 組合/折解品
              welfareYn:
                type: string
                description: 福利品
              whName:
                type: string
            type: object
          type: array
        errorMsg:
          type: string
          description: 錯誤訊息
        success:
          type: boolean
      type: object
    LoginInfo:
      type: object
      required: [entpCode, entpID, entpPwd, otpBackNo]
      properties:
        entpCode: { type: string, description: 廠商編號，文件示例為 6 碼。 }
        entpID: { type: string, description: 統一編號，文件示例為 8 碼。 }
        entpPwd: { type: string, format: password, description: SCM 密碼；文件說明長度為 8 至 14 碼。 }
        otpBackNo: { type: string, description: momo OTP 序號後 3 碼，可於 SCM C1209 查詢。 }
    PurchaseDetailRequest:
      properties:
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        tmp_balju_no:
          type: string
          description: 申請編號
      required:
        - loginInfo
        - tmp_balju_no
      type: object
    PurchaseDetailResponse:
      properties:
        ERROR:
          type: string
        dataList:
          items:
            properties:
              AQTY:
                type: integer
                description: 資料明細
              BALJU_QTY:
                type: integer
              EC_MIN_QTY:
                type: integer
                description: 最小入庫數量
              EXPECT_DATE:
                type: string
              EXP_DATE:
                type: string
                description: 入庫最低有效期限
              EXP_DAYS:
                type: string
                description: 保存天數
              GOODSDT_CODE:
                type: string
              GOODSDT_INFO:
                type: string
              GOODS_CODE:
                type: string
              GOODS_NAME:
                type: string
              INSERT_DATE:
                type: string
              INTERNATIONAL_NO:
                type: string
                description: 國際條碼
              TMP_BALJU_NO:
                type: string
              WH_CODE:
                type: string
            type: object
          type: array
      type: object
    PurchaseQueryRequest:
      properties:
        fromDate:
          type: string
        goodsCode:
          type: string
        goodsName:
          type: string
          description: 商品名稱
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        status:
          type: string
          description: 狀態
        toDate:
          type: string
      required:
        - loginInfo
        - fromDate
        - toDate
      type: object
    PurchaseQueryResponse:
      properties:
        ERROR:
          type: string
        dataList:
          items:
            properties:
              BALJU_NO:
                type: string
                description: 資料明細
              EXPECT_DATE:
                type: string
              INSERT_DATE:
                type: string
              MD_MARJOR_ID:
                type: string
                description: MD編號
              MD_NAME:
                type: string
              STATUS:
                type: string
                description: 狀態說明
              SUM_QTY:
                type: integer
                description: 採購總量
              TMP_BALJU_NO:
                type: string
              WH_CODE:
                type: string
              WH_NAME:
                type: string
            type: object
          type: array
      type: object
    ReturnDetailRequest:
      properties:
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        tmp_eout_quest_no:
          type: string
          description: 申請編號
      required:
        - loginInfo
        - tmp_eout_quest_no
      type: object
    ReturnDetailResponse:
      properties:
        ERROR:
          type: string
        dataList:
          items:
            properties:
              BALJU_NO:
                type: string
                description: 資料明細
              BUY_PRICE:
                type: integer
              EOUT_NOTE:
                type: string
              EOUT_QUEST_NO:
                type: string
              EOUT_QUEST_QTY:
                type: integer
              GOODSDT_CODE:
                type: string
              GOODSDT_INFO:
                type: string
              GOODS_CODE:
                type: string
              GOODS_NAME:
                type: string
            type: object
          type: array
      type: object
    ReturnQueryRequest:
      properties:
        fromDate:
          type: string
        goodsCode:
          type: string
        goodsName:
          type: string
          description: 商品名稱
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        status:
          type: string
          description: 狀態
        toDate:
          type: string
      required:
        - loginInfo
        - fromDate
        - toDate
      type: object
    ReturnQueryResponse:
      properties:
        ERROR:
          type: string
        dataList:
          items:
            properties:
              EOUTQUEST_DATE:
                type: string
                description: 資料明細
              EOUT_QUEST_QTY:
                type: integer
              MD_CODE:
                type: string
                description: MD編號
              MD_NAME:
                type: string
              P_FAIL_NOTE:
                type: string
                description: 退件原因
              STATUS:
                type: string
                description: 狀態說明
              TMP_EOUT_QUEST_NO:
                type: string
                description: 申請編號
              WH_CODE:
                type: string
              WH_NAME:
                type: string
            type: object
          type: array
      type: object
    SaveClaimFailRequest:
      properties:
        againNote:
          type: string
          description: 再次申訴
        compensation:
          type: number
          description: 請賠金額
        contactNote:
          type: string
          description: 聯絡方式
        goodsStatus:
          items:
            type: string
            description: 商品狀況
          type: array
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        note:
          type: string
        orderNo:
          type: string
          description: 訂單編號
        upload1:
          format: binary
          type: string
          description: 上傳圖檔
      type: object
    SaveClaimRejectRequest:
      properties:
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        note:
          type: string
        orderNo:
          type: string
          description: 訂單編號
      type: object
    SaveClaimWarehouseRequest:
      properties:
        compensation:
          type: number
          description: 請賠金額
        eoutQuestNo:
          type: string
        goodsList:
          type: string
          description: 商品編號
        goodsStatus:
          items:
            type: string
            description: 商品狀況
          type: array
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        note:
          type: string
        orderNo:
          type: string
          description: 訂單編號
        upload1:
          format: binary
          type: string
          description: 上傳圖檔
      type: object
    SaveShipConfirmContactRequest:
      properties:
        addNote:
          type: string
          description: 補充說明
        askNote:
          type: string
          description: 詳細描述狀況
        askType:
          type: string
          description: 確認需求原因
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        orderNo:
          type: string
          description: 訂單編號
      type: object
    SaveShipOthersRequest:
      properties:
        helpNote:
          type: string
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        note:
          type: string
        orderNo:
          type: string
          description: 訂單編號
        upload1:
          format: binary
          type: string
          description: 上傳圖檔
        upload2:
          format: binary
          type: string
          description: 上傳圖檔
      type: object
    MomoaskListRequest:
      type: object
      required: [loginInfo, seqOffset]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        seqOffset: { type: string, description: "前一次清單查詢回傳的游標。第一頁最多回傳 25 筆，後續頁面最多回傳 20 筆。" }
    MomoaskSearchRequest:
      type: object
      required: [loginInfo]
      anyOf:
        - required: [goodsCode]
        - required: [orderNumber]
        - required: [custName]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        goodsCode: { type: string, description: "商品編號。goodsCode、orderNumber、custName 至少須填一項；多項同時填寫時，查詢優先順序為 custName、orderNumber、goodsCode。" }
        orderNumber: { type: string, description: "訂單編號。goodsCode、orderNumber、custName 至少須填一項；多項同時填寫時，查詢優先順序為 custName、orderNumber、goodsCode。" }
        custName: { type: string, description: "顧客姓名。goodsCode、orderNumber、custName 至少須填一項；多項同時填寫時，查詢優先順序為 custName、orderNumber、goodsCode。" }
    MomoaskConversationRequest:
      type: object
      required: [loginInfo, orderNumber, order_g_seq, order_d_seq, order_w_seq, goodsCode, custNo, delyType, delyGbEntpCode]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        orderNumber: { type: string, description: "訂單編號。" }
        order_g_seq: { type: string, description: "訂單商品序號。" }
        order_d_seq: { type: string, description: "訂單明細序號。" }
        order_w_seq: { type: string, description: "訂單倉別序號。" }
        goodsCode: { type: string, description: "商品編號。" }
        custNo: { type: string, description: "顧客編號。" }
        delyType:
          type: string
          description: 配送類型。
          enum: ['10', '20']
          x-enum-descriptions: [宅配, 超商取貨]
        delyGbEntpCode: { type: string, description: "配送類型對應的供應商代碼。" }
        lastRecordID: { type: string, description: "最後一筆訊息紀錄 ID。未填時取得最新 20 筆；填入後取得往前 20 筆較舊訊息。" }
    MomoaskSendMessageRequest:
      allOf:
        - $ref: '#/components/schemas/MomoaskConversationRequest'
        - type: object
          required: [msgContent]
          properties:
            msgContent: { type: string, description: "要傳送的文字訊息內容。" }
    MomoaskRoomRequest:
      type: object
      required: [loginInfo, roomid]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        roomid: { type: string, description: "對話室 ID。" }
    MomoaskUpdateUsuallyMsgRequest:
      type: object
      required: [loginInfo, msgList]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        msgList:
          type: array
          description: 常用訊息文字，最多 10 筆，每筆最多 60 個字元。
          maxItems: 10
          items: { type: string, maxLength: 60 }
    MomoaskSendImageForm:
      type: object
      required: [jsonValue, imgFile]
      properties:
        jsonValue: { type: string, description: "JSON 字串，包含 MomoaskConversationRequest 欄位與訊息內容；不可包含 lastRecordID。" }
        imgFile: { type: string, format: binary, description: "要傳送的圖片檔案。" }
    MomoaskMessageItem:
      type: object
      properties:
        seq: { type: string, description: "訊息序號。" }
        custNo: { type: string, description: "顧客編號。" }
        goodsCode: { type: string, description: "商品編號。" }
        entpCode: { type: string, description: "供應商代碼。" }
        delyGbEntpCode: { type: string, description: "配送供應商代碼。" }
        orderNumber: { type: string, description: "訂單編號。" }
        order_g_seq: { type: string, description: "訂單商品序號。" }
        order_d_seq: { type: string, description: "訂單明細序號。" }
        order_w_seq: { type: string, description: "訂單倉別序號。" }
        goodsLastMsg: { type: string, description: "商品最後一則訊息。" }
        updateTime: { type: string, description: "最後更新時間。" }
        updateYMD: { type: string, description: "最後更新時間戳記，格式為 yyyyMMddhhmmss。" }
        recordStatus:
          type: string
          description: 已讀狀態。
          enum: ['0', '1']
          x-enum-descriptions: [未讀, 已讀]
        roomid: { type: string, description: "對話室 ID，可用於對話室相關 API。" }
        isTagged:
          type: string
          description: 是否將此對話標記為常用或其他標籤。
          enum: ['0', '1']
          x-enum-descriptions: [未標記, 已標記]
        goodsName: { type: string, description: "商品名稱。" }
        custName: { type: string, description: "顧客姓名。" }
        delyType:
          type: string
          description: 配送類型。
          enum: ['10', '20']
          x-enum-descriptions: [宅配, 超商取貨]
    MomoaskListResponse:
      type: object
      properties:
        success: { type: boolean, description: "請求是否成功完成。" }
        resultMessage: { type: string, description: "結果訊息；失敗時包含錯誤訊息。" }
        rtnData:
          type: array
          description: 對話清單；第一頁最多包含 25 筆。
          items: { $ref: '#/components/schemas/MomoaskMessageItem' }
    MomoaskConversationResponse:
      type: object
      properties:
        success: { type: boolean, description: "請求是否成功完成。" }
        resultMessage: { type: string, description: "結果訊息。" }
        rtnData:
          type: array
          description: 訊息歷程。
          items:
            type: object
            properties:
              seq: { type: string, description: "訊息序號。" }
              msgType:
                type: string
                description: 訊息類型。
                enum: ['0', '1', '2', '3', '4', '5']
                x-enum-descriptions: [顧客文字, 供應商文字, 顧客圖片, 供應商圖片, 系統訊息, 其他]
              msgContent: { type: string, description: "訊息文字或圖片 URL。" }
              msgTime: { type: string, description: "訊息時間。" }
              msgDate: { type: string, description: "訊息日期，格式為 yyyyMMdd。" }
    MomoaskResultResponse:
      type: object
      properties:
        success: { type: boolean, description: "請求是否成功完成。" }
        resultMessage: { type: string, description: "結果訊息；失敗時包含錯誤訊息。" }
    MomoaskUsuallyMsgResponse:
      allOf:
        - $ref: '#/components/schemas/MomoaskResultResponse'
        - type: object
          properties:
            msgList:
              type: array
              description: 常用訊息文字。
              items: { type: string }
    MomoaskGoodsOrderResponse:
      type: object
      properties:
        success: { type: boolean, description: 查詢是否成功。 }
        resultMessage: { type: string, description: 回傳訊息。 }
        goodsItem:
          type: object
          description: 商品明細。
          properties:
            goodsName: { type: string, description: 商品名稱。 }
            goodsImg: { type: string, description: 商品圖片。 }
            brandName: { type: string, description: 商品品牌。 }
            goodsCode: { type: string, description: 商品編號。 }
            goodsDtInfo: { type: string, description: 商品說明。 }
            entpGoodsNo: { type: string, description: 原廠編號。 }
        orderInfo:
          type: object
          description: 訂單明細。
          properties:
            orderStatus: { type: string, description: 訂單狀態。 }
            entpGoodsCode: { type: string, description: 原廠編號。 }
            goodsCode: { type: string, description: 商品編號。 }
            goodsDtCode: { type: string, description: 子品編號。 }
            goodsDtInfo: { type: string, description: 商品說明。 }
            orderTotalPrice: { type: string, description: 訂單總額。 }
            orderName: { type: string, description: 訂購人。 }
            orderNumber: { type: string, description: 訂購人電話（文件欄位名稱）。 }
            order_g_seq: { type: string, description: 訂單商品序號。 }
            order_d_seq: { type: string, description: 訂單細節序號。 }
            order_w_seq: { type: string, description: 訂單處理序號。 }
            showOrderDetail: { type: boolean, description: 是否有商品明細。 }
        deliveryInfo:
          type: object
          description: 配送資訊；乙配訂單不會有資料。
          properties:
            deliveryNo: { type: string, description: 配送單號。 }

        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        sendInfo:
          type: object
          description: '參數'
          properties:
            goodsCode: { type: string, description: '商品編號；可前後模糊搜尋' }
            goodsName: { type: string, description: '商品名稱；可前後模糊搜尋' }
            saleGB: { type: string, description: '銷售狀況；空值(“”):全部 00: 進行 11: 暫時中斷 19: 永久中斷' }

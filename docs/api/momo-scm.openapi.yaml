              SCM_YN:
                type: string
                description: 列印狀態
              STATUS_NAME:
                type: string
                description: 驗收狀態
              TMP_BALJU_NO:
                type: string
              TOTAL_BALJU_QTY:
                type: integer
                description: 採購總量
              WH_NAME:
                type: string
            type: object
          type: array
      type: object
    LoginInfo:
      type: object
      required: [entpCode, entpID, entpPwd, otpBackNo]
      properties:
        entpCode: { type: string, description: 廠商編號，文件示例為 6 碼。 }
        entpID: { type: string, description: 統一編號，文件示例為 8 碼。 }
        entpPwd: { type: string, format: password, description: SCM 密碼；文件說明長度為 8 至 14 碼。 }
        otpBackNo: { type: string, description: momo OTP 序號後 3 碼，可於 SCM C1209 查詢。 }
    MomoaskTotalListRequest:
      properties:
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        seqOffset:
          type: string
          description: 從第幾筆資料開始查詢
      type: object
    MomoaskTotalListResponse:
      properties:
        rtnData:
          items:
            properties:
              seq:
                type: string
                description: 序號
            type: object
          type: array
        success:
          type: boolean
      type: object
    OrderQueryRequest:
      properties:
        delyGb:
          type: string
          description: 訂單類型

    CounselUploadForm:
      type: object
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        orderNo: { type: string, description: 訂單編號。 }
        upload1: { type: string, format: binary, description: 上傳圖片 1（JPG）。 }
        upload2: { type: string, format: binary, description: 上傳圖片 2（JPG）。 }
        upload3: { type: string, format: binary, description: 上傳圖片 3（JPG）。 }
        upload4: { type: string, format: binary, description: 上傳圖片 4（JPG）。 }
        upload5: { type: string, format: binary, description: 上傳圖片 5（JPG）。 }
        upload6: { type: string, format: binary, description: 上傳圖片 6（JPG）。 }
        upload7: { type: string, format: binary, description: 上傳圖片 7（JPG）。 }
    SaveClaimDamageInTransitRequest:
      allOf:
        - $ref: '#/components/schemas/CounselUploadForm'
        - type: object
          required: [loginInfo, orderNo, compensation, goodsStatus, note, upload1]
          properties:
            compensation: { type: number, description: 請賠金額。廠配訂單回收（含超取）不可選運輸貨故請賠。 }
            goodsStatus:
              type: array
              minItems: 1
              description: 商品狀況，可複選。
              items: { type: string, enum: ['1', '2', '3'], x-enum-descriptions: ['僅外箱包材受損', '商品損壞', '商品遺失'] }
            note: { type: string, description: 詳細描述。 }
            contactNote: { type: string, description: 聯絡方式；商品狀況為 1、2 或 3 時需要填寫。 }
    SaveClaimUpdateStatusRequest:
      type: object
      required: [loginInfo, orderNo, note]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        orderNo: { type: string, description: 訂單編號。 }
        note: { type: string, description: 詳細描述狀況。 }
        orderNoList: { type: string, description: 其他訂單編號。 }
    SaveSuggestAfterSalesServiceRequest:
      allOf:
        - $ref: '#/components/schemas/CounselUploadForm'
        - type: object
          required: [loginInfo, orderNo]
          properties:
            note: { type: string, description: 詳細描述；note 與 helpNote 擇一填寫。 }
            helpNote: { type: string, description: 請求客服協助事項；note 與 helpNote 擇一填寫。 }
    RecycleSheetQueryRequest:
      type: object
      required: [loginInfo, frDate, frDate_hh, frDate_mm, toDate, toDate_hh, toDate_mm, orderbyType]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        frDate: { type: string, description: 查詢起日，格式為 yyyy/MM/dd。 }
        frDate_hh: { type: string, description: 查詢起始小時。 }
        frDate_mm: { type: string, description: 查詢起始分鐘。 }
        toDate: { type: string, description: 查詢迄日，格式為 yyyy/MM/dd。 }
        toDate_hh: { type: string, description: 查詢結束小時。 }
        toDate_mm: { type: string, description: 查詢結束分鐘。 }
        orderbyType: { type: string, enum: ['1', '2', '3'], description: 必填的排序類型。 }
        recycleOrderIdx: { type: string, description: 回收訂單索引篩選條件；規格表中的欄位名稱為 orderIdx。 }
        recycleGoodsCode: { type: string, description: 回收商品編號篩選條件。 }
        recycleOrderNo: { type: string, description: 回收訂單編號篩選條件。 }
        custOrderReply: { type: string, enum: ['', '0', '1'], x-enum-descriptions: [不限, 未回覆, 已回覆], description: 顧客訂單回覆狀態篩選條件。 }
    RecycleSheetQueryResponse:
      type: object
      properties:
        success: { type: boolean, description: 請求是否成功完成。 }
        errorMsg: { type: string, description: 錯誤訊息。 }
        dataList:
          type: array
          description: 回收單紀錄。
          items:
            type: object
            properties:
              orderAllNo: { type: string, description: 完整訂單編號。 }
              goodCode: { type: string, description: 商品編號；欄位拼字依原始回應保留。 }
              goodDtCode: { type: string, description: 商品明細編號。 }
              goodDtInfo: { type: string, description: 商品明細資訊。 }
              goodName: { type: string, description: 商品名稱。 }
              procDate: { type: string, description: 處理時間。 }
              custOrderReply: { type: string, enum: ['0', '1'], x-enum-descriptions: [未回覆, 已回覆], description: 顧客回覆狀態。 }
              fallMechineSerialNo: { type: string, description: 回收機序號；欄位拼字依原始回應保留。 }
              recycleSheetNo: { type: string, description: 回收單號。 }
              recycleSheetFile: { type: string, format: uri, description: 回收單檔案 URL。 }
              replyUser: { type: string, description: 回覆使用者。 }
              replyTime: { type: string, description: 回覆時間。 }
    RecycleSheetReplyForm:
      type: object
      required: [zip_File, jsonValue]
      properties:
        zip_File: { type: string, format: binary, description: 必填的 ZIP 壓縮檔，內含回收單圖片。 }
        jsonValue:
          type: string
          description: 必填 JSON 字串，包含 loginInfo 與 dataList；每筆 dataList 必須包含 recycleSheetNo、orderNo。
    RecycleSheetReplyResponse:
      type: object
      properties:
        success: { type: boolean, description: 請求是否成功完成。 }
        errorMsg: { type: string, description: 錯誤訊息。 }
        successCnt: { type: integer, description: 成功處理筆數。 }
        errorCnt: { type: integer, description: 失敗筆數。 }
        errorMsgList:
          type: array
          description: 失敗紀錄的錯誤訊息。
          items: { type: string }
    ShipTypeListResponse:
      type: object
      properties:
        ERROR: { type: string, description: 錯誤訊息，包含登入驗證錯誤。 }
        dataList:
          type: array
          description: 配送類型階層。
          items:
            type: object
            properties:
              name: { type: string, description: 配送類型名稱。 }
              neewWeight: { type: boolean, description: 是否需要重量；欄位拼字依原始回應保留。 }
              subLevelList:
                type: array
                description: 下一層配送類型選項。
                items:
                  type: object
                  properties:
                    name: { type: string, description: 配送子類型名稱。 }
    ChangeStoreRequest:
      type: object
      required: [loginInfo, sendInfoList]
      properties:
        doAction: { type: string, enum: [changeStore], description: 固定填入 changeStore，執行未回收訂單（超商退貨／客未取）的門市異動。 }
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        sendInfoList:
          type: array
          minItems: 1
          description: 要變更取貨門市的訂單清單。
          items:
            type: object
            required: [completeOrderNo, oldStoreId, newStoreId]
            properties:
              completeOrderNo: { type: string, description: 完整訂單編號。 }
              oldStoreId: { type: string, description: 原門市代碼。 }
              newStoreId: { type: string, description: 新門市代碼。 }
    ChangeStoreResponse:
      type: object
      properties:
        success: { type: boolean, description: 請求是否成功完成。 }
        message: { type: string, description: 結果訊息。 }
        data:
          type: object
          properties:
            totalCnt: { type: integer, description: 提交訂單總筆數。 }
            successCnt: { type: integer, description: 成功變更的訂單筆數。 }
            failOrderList:
              type: array
              description: 變更失敗的訂單。
              items:
                type: object
                properties:
                  orderNo: { type: string, description: 訂單編號。 }
                  message: { type: string, description: 失敗訊息。 }
    QueryStoreRequest:
      type: object
      required: [loginInfo, sendInfoList]
      properties:
        loginInfo: { $ref: '#/components/schemas/LoginInfo' }
        sendInfoList:
          type: array
          minItems: 1
          description: 門市查詢條件；規格範例在陣列中提供一個條件物件。
          items:
            type: object
            required: [delyGb]
            properties:
              delyGb: { type: string, enum: ['28', '29'], description: 必填的配送類別。 }
              storeId: { type: string, description: 選填的門市代碼篩選條件。 }
              storeName: { type: string, description: 選填的門市名稱篩選條件。 }
              storeAddress: { type: string, description: 選填的門市地址篩選條件。 }
    QueryStoreResponse:
      type: object
      properties:
        success: { type: boolean, description: 請求是否成功完成。 }
        message: { type: string, description: 結果訊息。 }
        data:
          type: array
          description: 符合條件的門市。
          items:
            type: object
            properties:
              storeId: { type: string, description: 門市代碼。 }
              storeName: { type: string, description: 門市名稱。 }
              storeAddress: { type: string, description: 門市地址。 }
paths:
  /api/v1/recycleSheet/queryList.scm:
    post:
      tags: [訂單]
      summary: 回收單查詢
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecycleSheetQueryRequest' }
      responses:
        '200':
          description: 回收單紀錄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecycleSheetQueryResponse' }
  /api/v1/recycleSheet/replyCounselImg.scm:
    post:
      tags: [訂單]
      summary: 上傳回收單回覆圖片
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecycleSheetReplyForm' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RecycleSheetReplyForm' }
      responses:
        '200':
          description: 上傳結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecycleSheetReplyResponse' }
  /order/shipType/getShipTypeList.scm:
    post:
      tags: [訂單]
      summary: 取得配送類型清單
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginInfo]
              properties:
                loginInfo: { $ref: '#/components/schemas/LoginInfo' }
      responses:
        '200':
          description: 配送類型階層
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipTypeListResponse' }
  /order/store/changeStore.scm:
    post:
      tags: [訂單]
      summary: 變更超商取貨門市
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStoreRequest' }
      responses:
        '200':
          description: 變更結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeStoreResponse' }
  /order/store/queryStore.scm:
    post:
      tags: [訂單]
      summary: 查詢超商取貨門市
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryStoreRequest' }
      responses:
        '200':
          description: 符合條件的門市
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryStoreResponse' }
  /GoodsServlet.do:
    post:
      tags: [商品]
      summary: 商品作業服務（依 doAction 選擇實際功能）
      requestBody:
        description: 一般商品作業使用 application/json；商品提報暫存或送審也可使用 multipart/form-data，上傳 ZIP 圖檔。
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsServletRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/GoodsServletMultipartRequest' }
      responses:
        '200':
          description: 依 doAction 回傳查詢清單，或商品提報的基本檢查與處理結果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsServletResponse' }
  /OrderServlet.do:
    post:
      tags: [訂單]
      summary: 訂單作業服務（依 doAction 選擇實際功能）
      requestBody:
        description: 請依所選 doAction 的查詢條件、單筆資料或批次訂單資料填寫。
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderServletRequest' }
      responses:
        '200':
          description: 依 doAction 回傳訂單查詢結果或作業處理結果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderServletResponse' }
  /api/v1/counsel/queryCounseldtList.scm:
    post:
      tags: [商談]
      summary: 查詢商談明細
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounselDetailRequest' }
      responses:
        '200':
          description: 請求成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounselDetailResponse' }
  /api/v1/counsel/queryEndList.scm:
    post:
      tags: [商談]
      summary: 查詢結案商談
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounselEndListRequest' }
      responses:
        '200':
          description: 請求成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounselListResponse' }
  /api/v1/counsel/queryProcessList.scm:
    post:
      tags: [商談]
      summary: 查詢處理中商談
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounselProcessListRequest' }
      responses:
        '200':
          description: 請求成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounselListResponse' }
  /api/v1/counsel/replyCounsel.scm:
    post:
      tags: [商談]
      summary: 回覆或更新商談文字
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounselReplyRequest' }
      responses:
        '200':
          description: 請求成功。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CounselBatchResponse' }
  /api/v1/counsel/replyCounselImg.scm:
    post:
      tags: [商談]
      summary: 回覆或更新商談圖片
      requestBody:
        required: true

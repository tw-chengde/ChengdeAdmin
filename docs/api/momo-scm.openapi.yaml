    GoodsServletRequest:
      description: 依 doAction 區分具體的商品作業請求規格。
      oneOf:
        - { $ref: '#/components/schemas/GoodsTempReportGoodsRequest' }
        - { $ref: '#/components/schemas/GoodsVerifyReportGoodsRequest' }
        - { $ref: '#/components/schemas/GoodsQueryGoodsBasicDataRequest' }
        - { $ref: '#/components/schemas/GoodsChangeGoodsQtyRequest' }
        - { $ref: '#/components/schemas/GoodsQueryOnOffShelfRequest' }
        - { $ref: '#/components/schemas/GoodsApplyOnOffShelfRequest' }
        - { $ref: '#/components/schemas/GoodsQueryGoodsListRequest' }
        - { $ref: '#/components/schemas/GoodsQueryGoodInfoRequest' }
        - { $ref: '#/components/schemas/GoodsQueryGoodScheduleRequest' }
        - { $ref: '#/components/schemas/GoodsQueryGoodsBasicCodeRequest' }
        - { $ref: '#/components/schemas/GoodsQueryPriceHistoryRequest' }
        - { $ref: '#/components/schemas/GoodsQueryDetailPriceHistoryRequest' }
      discriminator:
        propertyName: doAction
        mapping:
          tempReportGoods: '#/components/schemas/GoodsTempReportGoodsRequest'
          verifyReportGoods: '#/components/schemas/GoodsVerifyReportGoodsRequest'
          queryGoodsBasicData: '#/components/schemas/GoodsQueryGoodsBasicDataRequest'
          changeGoodsQty: '#/components/schemas/GoodsChangeGoodsQtyRequest'
          queryOnOffShelf: '#/components/schemas/GoodsQueryOnOffShelfRequest'
          applyOnOffShelf: '#/components/schemas/GoodsApplyOnOffShelfRequest'
          queryGoodsList: '#/components/schemas/GoodsQueryGoodsListRequest'
          queryGoodInfo: '#/components/schemas/GoodsQueryGoodInfoRequest'
          queryGoodSchedule: '#/components/schemas/GoodsQueryGoodScheduleRequest'
          queryGoodsBasicCode: '#/components/schemas/GoodsQueryGoodsBasicCodeRequest'
          queryPriceHistory: '#/components/schemas/GoodsQueryPriceHistoryRequest'
          queryDetailPriceHistory: '#/components/schemas/GoodsQueryDetailPriceHistoryRequest'
    GoodsServletResponse:
      description: 依請求的 doAction 回傳下列其中一種商品作業回應格式。
      anyOf:
        - { $ref: '#/components/schemas/GoodsTempReportGoodsResponse' }
        - { $ref: '#/components/schemas/GoodsVerifyReportGoodsResponse' }
        - { $ref: '#/components/schemas/GoodsQueryGoodsBasicDataResponse' }
        - { $ref: '#/components/schemas/GoodsChangeGoodsQtyResponse' }
        - { $ref: '#/components/schemas/GoodsQueryOnOffShelfResponse' }
        - { $ref: '#/components/schemas/GoodsApplyOnOffShelfResponse' }
        - { $ref: '#/components/schemas/GoodsQueryGoodsListResponse' }
        - { $ref: '#/components/schemas/GoodsQueryGoodInfoResponse' }
        - { $ref: '#/components/schemas/GoodsQueryGoodScheduleResponse' }
        - { $ref: '#/components/schemas/GoodsQueryGoodsBasicCodeResponse' }
        - { $ref: '#/components/schemas/GoodsQueryPriceHistoryResponse' }
        - { $ref: '#/components/schemas/GoodsQueryDetailPriceHistoryResponse' }
paths:
  /api/v1/recycleSheet/queryList.scm:
    post:
      tags: [訂單]
      summary: 回收單查詢
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecycleSheetQueryRequest' }
      responses:
        '200':
          description: 回收單紀錄
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecycleSheetQueryResponse' }
  /api/v1/recycleSheet/replyCounselImg.scm:
    post:
      tags: [訂單]
      summary: 上傳回收單回覆圖片
      requestBody:
        required: true
        description: >-
          規格書 V5.7 的「傳輸方式」欄寫 application/json，但輸入參數含檔案（zip_File）且範例為 Postman
          form-data，實際以 multipart/form-data 送出；jsonValue 為 JSON 字串。
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RecycleSheetReplyForm' }
            encoding:
              zip_File: { contentType: application/zip }
              jsonValue: { contentType: application/json }
      responses:
        '200':
          description: 上傳結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecycleSheetReplyResponse' }
  /order/shipType/getShipTypeList.scm:
    post:
      tags: [訂單]
      summary: 取得配送類型清單
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginInfo]
              properties:
                loginInfo: { $ref: '#/components/schemas/LoginInfo' }
      responses:
        '200':
          description: 配送類型階層
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipTypeListResponse' }
  /order/store/changeStore.scm:
    post:
      tags: [訂單]
      summary: 變更超商取貨門市
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStoreRequest' }
      responses:
        '200':
          description: 變更結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeStoreResponse' }
  /order/store/queryStore.scm:
    post:
      tags: [訂單]
      summary: 查詢超商取貨門市
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueryStoreRequest' }
      responses:
        '200':
          description: 符合條件的門市
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueryStoreResponse' }
  /GoodsServlet.do:
    post:
      tags: [商品]
      summary: 商品作業服務（依 doAction 選擇實際功能）
      requestBody:
        description: 一般商品作業使用 application/json；商品提報暫存或送審也可使用 multipart/form-data，上傳 ZIP 圖檔。
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsServletRequest' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/GoodsServletMultipartRequest' }
      responses:
        '200':
          description: 依 doAction 回傳查詢清單，或商品提報的基本檢查與處理結果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsServletResponse' }
  /OrderServlet.do:
    post:
      tags: [訂單]
      summary: 訂單作業服務（依 doAction 選擇實際功能）
      requestBody:
        description: 請依所選 doAction 的查詢條件、單筆資料或批次訂單資料填寫。
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderServletRequest' }
      responses:
        '200':
          description: 依 doAction 回傳訂單查詢結果或作業處理結果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderServletResponse' }

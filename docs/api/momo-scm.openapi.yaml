openapi: 3.0.3
info:
  description: 完整萃取自規格書的 API 呼叫與回傳格式
  title: momo SCM 後台管理系統 - 廠商 API
  version: 1.0.0
servers:
  - url: https://scmapi.momoshop.com.tw
    description: momo SCM API 伺服器
tags:
  - name: 訂單
    description: 訂單查詢、出貨、回收、取貨門市與回收聯單作業。
  - name: 商品
    description: 商品提報、查詢、庫存與上下架作業。
  - name: 商品異動
    description: 商品價格、屬性、規格、贈品與其他資料異動作業。
  - name: 商品編碼
    description: 商品分類、品牌、館架與其他編碼查詢。
  - name: 寄倉
    description: 寄倉入庫、退倉、庫存、採購與通知作業。
  - name: 商談
    description: SCM 商談查詢、讀取與回覆作業。
  - name: 聯絡 momo
    description: 出貨、回收與售後問題的聯絡 momo 作業。
  - name: 問問
    description: momo 問問訊息、標記與常用訊息作業。
  - name: 帳務
    description: 對帳與款項明細查詢。
components:
  schemas:
    AppliedListRequest:
      properties:
        dateFlag:
          type: string
        entpGoodsNo:
          type: string
        fromDate:
          type: string
        goodsCode:
          type: string
        goodsName:
          type: string
          description: 商品名稱
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        mdId:
          type: string
          description: MD編號
        pFlag:
          type: string
          description: 狀態
        toDate:
          type: string
        whCode:
          type: string
      type: object
    AppliedListResponse:
      properties:
        ENTP_GOODS_NO:
          type: string
        EOUT_NOTE:
          type: string
        EOUT_PLAN_DATE:
          type: string
        EOUT_QUEST_NO:
          type: string
        EOUT_QUEST_QTY:
          type: integer
        GOODSDT_CODE:
          type: string
        GOODSDT_INFO:
          type: string
        GOODS_CODE:
          type: string
        GOODS_NAME:
          type: string
        PM_USER:
          type: string
          description: 負責PM
        P_FAIL_NOTE:
          type: string
          description: 退件原因
        P_FLAG:
          type: string
          description: 狀態
        TMP_EOUT_QUEST_NO:
          type: string
          description: 申請編號
        USER_NAME:
          type: string
        WH_NAME:
          type: string
      type: object
    ApplyAbleQueryRequest:
      properties:
        ecAutoYn:
          type: string
          description: 補貨通知
        entpGoodsNo:
          type: string
        goodsCode:
          type: string
        goodsName:
          type: string
          description: 商品名稱
        goodsType:
          type: string
          description: 新品
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
        mdID:
          type: string
          description: MD編號
        op:
          type: string
        redLightFlag:
          type: string
          description: 警示紅燈
        saleGb:
          type: string
        stockQty:
          type: integer
        whCode:
          type: string
      required:
        - loginInfo
      type: object
    ApplyRequest:
      properties:
        APPLY_LIST:
          items:
            properties:
              BALJU_DATE:
                type: string
              BALJU_QTY:
                type: integer
              CHANGE_YN:
                type: string
                description: 補貨通知申請
              GOODSDT_CODE:
                type: string
              GOODS_CODE:
                type: string
              WH_CODE:
                type: string
            type: object
          type: array
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
      required:
        - loginInfo
        - APPLY_LIST
      type: object
    ApplyResponse:
      properties:
        ERROR:
          type: string
        SAVE_MESSAGE:
          properties:
            APPLY_SUCCESS:
              type: string
            ERROR:
              type: string
            RESULT:
              type: string
          type: object
      type: object
    ApplyReturnRequest:
      properties:
        EOUT_NOTE:
          type: string
        EOUT_QUEST_QTY:
          type: string
        GOODSDT_CODE:
          type: string
        GOODS_CODE:
          type: string
        WH_CODE:
          type: string
        loginInfo:
          $ref: '#/components/schemas/LoginInfo'
      type: object
    BackToGoodsRequest:
      properties:
        fromDate:

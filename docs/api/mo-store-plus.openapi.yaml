openapi: 3.0.3
info:
  title: momo 店+後台管理系統 - 廠商 API
  version: 0.11.3
  description: |
    完整萃取自規格書「momo 店+後台管理系統 - 廠商 API 規格書 v.0.11.3」。

    涵蓋規格書的全部 32 個操作端點（商品相關 22 項、訂單相關 10 項），
    包含各欄位的必填性（`required`）、列舉值（`enum`）與備註。

    ## 認證
    所有 API 皆需於 HTTP HEADER 帶入 `Authorization: Bearer <TOKEN>`（RFC-6750）。
    TOKEN 由「momo 店+後台管理系統」→「商店」→「權限管理」→「A103 API 串接 IP 位址管理」申請，
    審核開通後寄送至 API 串接聯絡人信箱。發送請求的主機對外 IP 必須為 A103 已登記的 IP 之一。
servers:
  - url: https://api3p.momo.com.tw
    description: momo 店+廠商 API 伺服器
tags:
  - name: 商品相關
    description: 規格書「貳、API 規格說明 / 一、商品相關」
  - name: 訂單相關
    description: 規格書「貳、API 規格說明 / 二、訂單相關」
components:
  schemas:
    # ------------------------------------------------------------------
    # 共用
    # ------------------------------------------------------------------
    OrderRef:
      type: object
      description: 訂單編號與品項流水號的組合
      required:
        - orderNo
        - orderSeq
      properties:
        orderNo:
          type: string
          description: 訂單編號
        orderSeq:
          type: string
          description: 訂單品項流水號

    # ------------------------------------------------------------------
    # 商品相關
    # ------------------------------------------------------------------
    CategoryTreeNode:
      type: object
      description: 商品分類節點（可遞迴巢狀）
      required:
        - id
        - value
        - isLeaf
      properties:
        id:
          type: string
          description: 分類 id（子節點為分類編號）
        value:
          type: string
          description: 分類名稱
        isLeaf:
          type: string
          description: 是否葉子節點。0：否、1：是
          enum:
            - '0'
            - '1'
        childrens:
          type: array
          description: 子節點
          items:
            $ref: '#/components/schemas/CategoryTreeNode'

    GoodsSaleStatusRequest:
      type: object
      required:
        - listGoodsCode
      properties:
        listGoodsCode:
          type: array
          description: 商品編號陣列
          items:
            type: string

    InspectionParam:
      type: object
      description: 檢驗報告書
      properties:
        inspectionEffectiveDate:
          type: string
          description: 檢驗報告書開始時間（格式 yyyy-MM-dd HH:mm:ss）
        inspectionExpiredDate:
          type: string
          description: 檢驗報告書結束時間（格式 yyyy-MM-dd HH:mm:ss）
        inspectionFileIdList:
          type: array
          description: 檢驗報告書圖檔（如有填寫 inspectionEffectiveDate，需至少上傳 1 張低於 500K 的圖檔）
          items:
            type: string

    PcertDescribeParam:
      type: object
      description: 相關認證字號
      properties:
        proChkCode:
          type: string
          description: 商檢字號
        nccChkCode:
          type: string
          description: NCC 字號
        energyLabel:
          type: string
          description: 能源效率分級
        pcertImgId:
          type: string
          description: 附件圖片 id（可利用 /apiv2/VendorApi/FileDetail 查詢）

    SizeParamItem:
      type: object
      properties:
        type:
          type: string
          description: 尺寸類型
          enum:
            - underwear
            - jacket
            - dress
            - underpants
            - skirt
            - shoe
        unit:
          type: string
          description: 單位
          enum:
            - cm
            - inch
        clothingSizesParamList:
          type: array
          description: '尺寸資料，例：[["1","2"],["2","3"]]'
          items:
            type: array
            items:
              type: string
        clothingTrysParamList:
          type: array
          description: '試穿報告，例：[["a","b"],["c","d"]]'
          items:
            type: array
            items:
              type: string

    GoodsAttrParamItem:
      type: object
      properties:
        goodsAttrId:
          type: string
          description: 商品屬性主檔編號
        indexNo:
          type: string
          description: 商品屬性分群編號
        indexItemNoList:
          type: array
          description: 商品屬性分群內容編號
          items:
            type: string

    GoodsDescribeParamItem:
      type: object
      properties:
        type:
          type: string
          description: 類型
          enum:
            - slogan
            - nevin
        content:
          type: string
          description: 内容

    EnvMedicineParam:
      type: object
      description: 環境用藥信息（可透過 /apiv2/VendorApi/QuerySetting 查詢是否需要填寫）
      properties:
        envMedicineCode:
          type: string
          description: |
            環境用藥許可證字號。格式為下列前綴加四碼數字：
            衛製-／衛輸-／微製-／微輸-／汙製-／汙輸-
        envMedicineEntpName:
          type: string
          description: 廠商名稱
        envMedicineChkCode:
          type: string
          description: '環境用藥販賣許可證。格式：兩碼數字-三碼數字，範例 00-945'

    TempGoodsSkuParamItem:
      type: object
      description: 規格列表項目（新增商品／編輯暫存商品用）
      required:
        - entpGoodsNo
        - internationalNo
        - canSaleQty
        - salePrice
        - imgFileId
      properties:
        goodsdtInfo1:
          type: string
          description: 規格一值（自定義規格一）。colName1 有填時必填；無規格（單一規格）時不需填寫
        goodsdtInfo2:
          type: string
          description: 規格二值（自定義規格二）。colName2 有填時必填；無規格（單一規格）時不需填寫
        saleGb:
          type: string
          description: 規格狀態
          enum:
            - 'on'
            - 'off'
        entpGoodsNo:
          type: string
          description: 供應商原廠貨號（長度請勿超過 150）
        internationalNo:
          type: string
          description: 國際條碼
        canSaleQty:
          type: string
          description: 庫存量
        salePrice:
          type: string
          description: 售價
        custPrice:
          type: string
          description: 市價
        imgFileId:
          type: string
          description: 圖檔 id（可利用 /apiv2/VendorApi/FileDetail 查詢）

    GoodsModifySkuParamItem:
      type: object
      description: 規格列表項目（已上架商品資料編輯用）
      required:
        - saleGb
        - internationalNo
        - canSaleQty
        - salePrice
        - imgFileId
      properties:
        goodsDtCode:
          type: string
          description: |
            規格(sku)編號／商品子品項編號。
            既有規格為必填且需依原規格順序填寫；新增的規格則不必填寫。
            可透過 /VendorApi/GoodsQueryByMethod 查詢 sku 編號。
        goodsdtInfo1:
          type: string
          description: 規格一值（自定義規格一）。colName1 有填時必填；無規格（單一規格）時不需填寫
        goodsdtInfo2:
          type: string
          description: 規格二值（自定義規格二）。colName2 有填時必填；無規格（單一規格）時不需填寫
        saleGb:
          type: string
          description: 規格狀態
          enum:
            - 'on'
            - 'off'
        entpGoodsNo:
          type: string
          description: 供應商原廠貨號（長度請勿超過 150）
        internationalNo:
          type: string
          description: 國際條碼
        canSaleQty:
          type: string
          description: 庫存量
        salePrice:
          type: string
          description: 售價
        custPrice:
          type: string
          description: 市價
        imgFileId:
          type: string
          description: 圖檔 id（可利用 /apiv2/VendorApi/FileDetail 查詢）

    TempGoodsModifyRequest:
      type: object
      description: |
        新增商品 & 編輯暫存商品（/apiv2/VendorApi/TempGoodsmodify）的請求。
        建議新增商品前，先使用商品相關第 10~16 支 API 查詢所需的分類、品牌、屬性等資料。
      required:
        - goodsName
        - freeShipping
        - weight
        - logisticsNoList
        - skuParamList
        - goodsImgIdList
      properties:
        goodsCode:
          type: string
          description: 商品編號（如有值，表示為暫存品的編輯）
        webBrandNo:
          type: string
          description: 商品品牌編號（可透過 /apiv2/VendorApi/ListWebBrand 取得）
        webBrandSeries:
          type: string
          description: 品牌系列
        goodsName:
          type: string
          description: 商品名稱
        categoryCode:
          type: string
          description: 分類編號（如 goodsCode 未填寫而 categoryCode 有填，新增商品時以此分類編號為主）
        nsTaxDone:
          type: boolean
          description: |
            是否應免稅。true：免稅、false：應稅（僅限店家開立發票可選擇免稅）。
            特定分類需填寫，可透過 /apiv2/VendorApi/QuerySetting 查詢是否需要填寫
        freeShipping:
          type: boolean
          description: 是否免運費。true：是（此商品費用由商店全額負擔）、false：否
        categoryByEntpCodeList:
          type: array
          description: 商店分類多個
          items:
            type: string
        inspectionParam:
          $ref: '#/components/schemas/InspectionParam'
        asYn:
          type: boolean
          description: 是否有售後保固。true：是、false：否
        asTerm:
          type: string
          description: 保固(維修)天數（若為永久保固請填入 99999）
        asNote:
          type: string
          description: 保固內容（長度不能超過 800）
        delyTemp:
          type: string
          description: 配送溫層
          enum:
            - normalTemperature
            - frozen
            - refrigerated
        volumeType:
          type: string
          description: 材積類型。outerBoxSize：外箱尺寸、volumeSpacing：材積級距
          enum:
            - outerBoxSize
            - volumeSpacing
        length:
          type: string
          description: 長度（選擇 volumeSpacing 時可不必填寫）
        width:
          type: string
          description: 寬度（選擇 volumeSpacing 時可不必填寫）
        height:
          type: string
          description: 高度（選擇 volumeSpacing 時可不必填寫）
        weight:
          type: string
          description: 重量（v0.7.0 起為必填）
        volume:
          type: string
          description: 材積級距。當 volumeType 選擇 volumeSpacing 時必填
          enum:
            - '60'
            - '90'
            - '105'
            - '120'
            - '150'
            - '151'
        logisticsNoList:
          type: array
          description: 配送物流方式設定
          items:
            type: string
            enum:
              - convenienceStore
              - thirdParty
              - generalHomeDelivery
        realLogisticsNo:
          type: string
          description: 物流運費編號（可透過 /apiv2/VendorApi/GetCustomizeFreightList 查詢 logisticsNo）
        outplaceSeq:
          type: string
          description: 出貨地代碼（可透過 /apiv2/VendorApi/GetToutplaceList 查詢）
        skuParamList:
          type: array
          description: 規格列表
          items:
            $ref: '#/components/schemas/TempGoodsSkuParamItem'
        pcertDescribeParam:
          $ref: '#/components/schemas/PcertDescribeParam'
        sizeParam:
          type: array
          description: 尺寸參數
          items:
            $ref: '#/components/schemas/SizeParamItem'
        goodsAttrParamList:
          type: array
          description: 規格屬性列表
          items:
            $ref: '#/components/schemas/GoodsAttrParamItem'
        goodsNote:
          type: string
          description: |
            商品規格描述。填寫內容可使用 /apiv2/VendorApi/QuerySetting 查詢；
            如 QuerySetting 的 content 有回傳值，內容為字串，每個題目之間需使用換行符號 (\n)
        goodsDescribeParamList:
          type: array
          description: 商品特色頁描述
          items:
            $ref: '#/components/schemas/GoodsDescribeParamItem'
        youtubeLink:
          type: string
          nullable: true
          description: Youtube ID
        goodsImgIdList:
          type: array
          description: 商品主圖 id 列表（可利用 /apiv2/VendorApi/FileDetail 查詢）
          items:
            type: string
        adImgFileId:
          type: string
          description: 商品廣告圖 id（可利用 /apiv2/VendorApi/FileDetail 查詢）
        exportImgFileIdList:
          type: array
          description: 商品特色（專推）-圖檔。可提供圖檔 id 清單，會放置到 htmlEditor
          items:
            type: string
        youtubeLinkList:
          type: array
          description: 商品特色（專推）- 商品影音。可放多個 Youtube 連結，會放置到 htmlEditor
          items:
            type: string
        htmlEditor:
          type: string
          description: 專推
        envMedicineParam:
          $ref: '#/components/schemas/EnvMedicineParam'
        recycleItem:
          type: string
          description: 回收項目(大型家電)（長度不可超過 500）
        mountYn:
          type: boolean
          description: 大型家電是否含安裝。true：含安裝、false：不含安裝
        nsAppShippingDone:
          type: boolean
          description: 是否為約定送貨。可透過 /apiv2/VendorApi/QuerySetting 查詢是否需要填寫
        onType:
          type: string
          description: |
            商品上架方式。now：立即上架、time：預約（商品將於所預約之開始時間上架，結束時間下架）。
            未填值時，商品狀態為暫存
          enum:
            - now
            - time
        startDate:
          type: string
          description: 開始時間（如 onType=time 需填寫，格式 yyyy-MM-dd HH:mm:ss）
        endDate:
          type: string
          description: 結束時間（如 onType=time 需填寫，格式 yyyy-MM-dd HH:mm:ss）
        colName1:
          type: string
          description: 規格一名（若該商品為無規格（單一規格），此參數可不必填寫）
        colName2:
          type: string
          description: 規格二名（若該商品為無規格（單一規格），此參數可不必填寫）

    GoodsModifyRequest:
      type: object
      description: |
        已上架商品資料編輯（/apiv2/VendorApi/GoodsModify）的請求。

        v0.11.2 起的規格並存處理方式：若要傳規格，只需將新規格都傳過來，若新規格有沒傳的，程式會提醒。
        - 無規格 + 單規格：需傳全部單規格，若多傳了無規格的資訊會直接壓刪除
        - 單規格 + 雙規格：需傳全部雙規格，若多傳了單規格的資訊會直接壓刪除
        - 無規格 + 雙規格：需傳全部雙規格，若多傳了無規格的資訊會直接壓刪除

        規格判定：
        - 無規格：colName1 和 colName2 都沒填，則 skuParamList 裡的 goodsdtInfo1／goodsdtInfo2 不需填
        - 單規格：colName1 有填、colName2 沒填，則 goodsdtInfo1 必填、goodsdtInfo2 不需填
        - 雙規格：colName1 和 colName2 都有填，則 goodsdtInfo1 和 goodsdtInfo2 都必填
      required:
        - goodsCode
        - goodsName
        - freeShippingYn
        - volumeType
        - logisticsNoList
        - skuParamList
        - goodsImgIdList
        - onType
      properties:
        goodsCode:
          type: string
          description: 商品編號
        webBrandNo:
          type: string
          description: 商品品牌編號
        webBrandSeries:
          type: string
          description: 品牌系列
        goodsName:
          type: string
          description: 商品名稱
        freeShippingYn:
          type: string
          description: 是否免運費。0：否、1：是（此商品費用由商店全額負擔）
          enum:
            - '0'
            - '1'
        categoryByEntpCodeList:
          type: array
          description: 商店分類多個
          items:
            type: string
        inspectionParam:
          $ref: '#/components/schemas/InspectionParam'
        asYn:
          type: boolean
          description: 是否有售後保固。1：是、0：否
        asTerm:
          type: string
          description: 保固(維修)天數
        asNote:
          type: string
          description: 保固內容（長度不能超過 800）
        delyTemp:
          type: string
          description: 配送溫層
          enum:
            - normalTemperature
            - frozen
            - refrigerated
        volumeType:
          type: string
          description: 材積類型。outerBoxSize：外箱尺寸、volumeSpacing：材積級距
          enum:
            - outerBoxSize
            - volumeSpacing
        length:
          type: string
          description: 長度（選擇 volumeSpacing 時可不必填寫）
        width:
          type: string
          description: 寬度（選擇 volumeSpacing 時可不必填寫）
        height:
          type: string
          description: 高度（選擇 volumeSpacing 時可不必填寫）
        weight:
          type: string
          description: 重量
        volume:
          type: string
          description: 材積級距
          enum:
            - '60'
            - '90'
            - '105'
            - '120'
            - '150'
            - '151'
        logisticsNoList:
          type: array
          description: 配送物流方式設定
          items:
            type: string
            enum:
              - convenienceStore
              - thirdParty
              - generalHomeDelivery
        realLogisticsNo:
          type: string
          description: |
            物流運費編號。logisticsNoList 有 generalHomeDelivery 時必填。
            可透過 /apiv2/VendorApi/GetCustomizeFreightList 查詢 logisticsNo
        outplaceSeq:
          type: string
          description: |
            出貨地代碼。logisticsNoList 有 thirdParty 時必填。
            可透過 /apiv2/VendorApi/GetToutplaceList 查詢第三方物流出貨地
        skuParamList:
          type: array
          description: 規格列表
          items:
            $ref: '#/components/schemas/GoodsModifySkuParamItem'
        pcertDescribeParam:
          $ref: '#/components/schemas/PcertDescribeParam'
        sizeParam:
          type: array
          description: 尺寸參數
          items:
            $ref: '#/components/schemas/SizeParamItem'
        goodsAttrParamList:
          type: array
          description: 規格屬性列表
          items:
            $ref: '#/components/schemas/GoodsAttrParamItem'
        goodsNote:
          type: string
          description: |
            商品規格描述。特定分類需填寫，可透過 /apiv2/VendorApi/QuerySetting 查詢是否需要填寫；
            如 QuerySetting 的 content 有回傳值，內容為字串，每個題目之間需使用換行符號 (\n)
        goodsDescribeParamList:
          type: array
          description: 商品特色頁描述
          items:
            $ref: '#/components/schemas/GoodsDescribeParamItem'
        youtubeLink:
          type: string
          nullable: true
          description: Youtube ID
        goodsImgIdList:
          type: array
          description: 商品主圖 id 列表（可利用 /apiv2/VendorApi/FileDetail 查詢）
          items:
            type: string
        adImgFileId:
          type: string
          description: 商品廣告圖 id（可利用 /apiv2/VendorApi/FileDetail 查詢）
        exportImgFileIdList:
          type: array
          description: 商品特色（專推）-圖檔。可提供圖檔 id 清單，會放置到 htmlEditor
          items:
            type: string
        youtubeLinkList:
          type: array
          description: 商品特色（專推）- 商品影音。可放多個 Youtube 連結，會放置到 htmlEditor
          items:
            type: string
        htmlEditor:
          type: string
          description: 專推
        envMedicineParam:
          $ref: '#/components/schemas/EnvMedicineParam'
        recycleItem:
          type: string
          description: 回收項目(大型家電)（長度不可超過 500）
        mountYn:
          type: boolean
          description: 大型家電是否含安裝。true：含安裝、false：不含安裝
        nsAppShippingDone:
          type: boolean
          description: 是否為約定送貨。可透過 /apiv2/VendorApi/QuerySetting 查詢是否需要填寫
        onType:
          type: string
          description: 商品上架方式。now：上架、time：預約（商品將於所預約之開始時間上架，結束時間下架）
          enum:
            - now
            - time
        startDate:
          type: string
          description: 開始時間（如 onType=time 需填寫，格式 yyyy-MM-dd HH:mm:ss）
        endDate:
          type: string
          description: 結束時間（如 onType=time 需填寫，格式 yyyy-MM-dd HH:mm:ss）
        colName1:
          type: string
          description: 規格一名（若該商品為無規格（單一規格），此參數可不必填寫）
        colName2:
          type: string
          description: 規格二名（若該商品為無規格（單一規格），此參數可不必填寫）

    GoodsUpsertResponse:
      type: object
      required:
        - success
        - errorMessage
      properties:
        success:
          type: boolean
          description: 上架成功或失敗
        errorMessage:
          type: string
          description: 上架失敗時的錯誤訊息
        data:
          type: string
          description: 商品編號

    # ------------------------------------------------------------------
    # 訂單相關
    # ------------------------------------------------------------------
    OrderDeliveryConfirmationResponse:
      type: object
      required:
        - confirmDeliveryDetailResList
      properties:
        success:
          type: boolean
          description: 整體請求成功或失敗
        errorMessage:
          type: string
          description: 整體請求失敗時的錯誤訊息
        confirmDeliveryDetailResList:
          type: array
          description: 確認結果明細
          items:
            type: object
            required:
              - orderNo
              - orderSeq
              - success
              - message
            properties:
              orderNo:
                type: string
                description: 訂單編號
              orderSeq:
                type: string
                description: 訂單品項流水號
              success:
                type: boolean
                description: 是否成功
              message:
                type: string
                description: 信息

    StoreDeliveryConfirmationItem:
      type: object
      description: 超商出貨確認的訂單項目（711 / 全家共用）
      required:
        - deliveryStatus
      properties:
        newBoxYn:
          type: string
          description: 倂箱號
        deliveryStatus:
          type: string
          description: |
            配送狀態。
            Shipped：已配送/可出貨；
            CancelNoStockOrder：無貨取消訂單；
            OtherDeliverTypeOrMissIngBox：已用其它方式出貨或漏併箱；
            StoreNote：商店備註
          enum:
            - Shipped
            - CancelNoStockOrder
            - OtherDeliverTypeOrMissIngBox
            - StoreNote
        deliveryNote:
          type: string
          description: 配送訊息（可帶空值）
        orderList:
          type: array
          description: 訂單列表。orderSeq 運費可不用提供，限填回收的主商品 orderSeq
          items:
            $ref: '#/components/schemas/OrderRef'

    SevenStoreDeliveryConfirmationRequest:
      type: object
      required:
        - delyGb
        - listItem
      properties:
        delyGb:
          type: integer
          description: 超取類型。21：倉到店、22：店到店
          enum:
            - 21
            - 22
        listItem:
          type: array
          description: 訂單項變價陣列（不能超過 100 筆）
          maxItems: 100
          items:
            $ref: '#/components/schemas/StoreDeliveryConfirmationItem'

    FamilyStoreDeliveryConfirmationRequest:
      type: object
      required:
        - delyGb
        - listItem
      properties:
        delyGb:
          type: integer
          description: 超取類型。29：常溫店到店、27：常溫倉到店、24：冷凍店到店、23：冷凍倉到店
          enum:
            - 29
            - 27
            - 24
            - 23
        listItem:
          type: array
          description: 訂單項變價陣列（不能超過 100 筆）
          maxItems: 100
          items:
            $ref: '#/components/schemas/StoreDeliveryConfirmationItem'

    ConvenienceStoreDeliveryConfirmationResponse:
      type: object
      required:
        - confirmDeliveryDetailResList
      properties:
        success:
          type: boolean
          description: 整體請求成功或失敗
        errorMessage:
          type: string
          description: 整體請求失敗時的錯誤訊息
        confirmDeliveryDetailResList:
          type: array
          description: 確認結果明細
          items:
            type: object
            required:
              - deliveryStatus
              - slipNo
              - printLable
              - printDetail
              - success
            properties:
              newBoxYn:
                type: string
                description: 倂箱號
              slipNo:
                type: string
                description: 物流單號
              deliveryStatus:
                type: string
                description: 配送狀態
                enum:
                  - Shipped
                  - CancelNoStockOrder
                  - OtherDeliverTypeOrMissIngBox
                  - StoreNote
              deliveryNote:
                type: string
                description: 配送訊息
              printLable:
                type: string
                description: 列印標籤（base64 字符）
              printDetail:
                type: string
                description: 列印明細（base64 字符）
              orderList:
                type: array
                description: 訂單列表
                items:
                  $ref: '#/components/schemas/OrderRef'
              success:
                type: boolean
                description: 是否成功
              message:
                type: string
                description: 信息

    SevenStoreLabelRequest:
      type: object
      required:
        - listItem
      properties:
        listItem:
          type: array
          description: 訂單陣列
          items:
            type: object
            required:
              - delyGb
            properties:
              delyGb:
                type: integer
                description: 超取類型。21：倉到店、22：店到店
                enum:
                  - 21
                  - 22
              orderList:
                type: array
                description: 訂單列表（需同一筆訂單同一個宅單）
                items:
                  $ref: '#/components/schemas/OrderRef'

    FamilyStoreLabelRequest:
      type: object
      required:
        - listItem
      properties:
        listItem:
          type: array
          description: 訂單陣列
          items:
            type: object
            required:
              - delyGb
            properties:
              delyGb:
                type: integer
                description: 超取類型。29：常溫店到店、27：常溫倉到店、24：冷凍店到店、23：冷凍倉到店
                enum:
                  - 29
                  - 27
                  - 24
                  - 23
              orderList:
                type: array
                description: 訂單列表（需同一筆訂單同一個宅單）
                items:
                  $ref: '#/components/schemas/OrderRef'

    ConvenienceStoreLabelResponse:
      type: object
      required:
        - orderPrintLabelResList
      properties:
        success:
          type: boolean
          description: 整體請求成功或失敗
        errorMessage:
          type: string
          description: 整體請求失敗時的錯誤訊息
        orderPrintLabelResList:
          type: array
          description: 確認結果明細
          items:
            type: object
            required:
              - printLable
              - printDetail
              - printAll
              - message
            properties:
              printLable:
                type: string
                description: 列印標籤
              printDetail:
                type: string
                description: 列印明細（字串流，收到檔案請用統編解密）
              printAll:
                type: string
                description: 列印出貨總表
              orderList:
                type: array
                description: 訂單列表
                items:
                  $ref: '#/components/schemas/OrderRef'
              message:
                type: string
                description: 信息
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /VendorApi/GoodsStartSelling:
    post:
      tags:
        - 商品相關
      summary: 1. 商品上架
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsSaleStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      required:
                        - goodsCode
                        - success
                        - errorMessage
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        success:
                          type: boolean
                          description: 上架成功或失敗 (true / false)
                        errorMessage:
                          type: string
                          description: 上架失敗時的錯誤訊息
  /VendorApi/GoodsStopSelling:
    post:
      tags:
        - 商品相關
      summary: 2. 商品下架
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsSaleStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      required:
                        - goodsCode
                        - success
                        - errorMessage
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        success:
                          type: boolean
                          description: 下架成功或失敗 (true / false)
                        errorMessage:
                          type: string
                          description: 下架失敗時的錯誤訊息
  /VendorApi/GoodsPriceModify:
    post:
      tags:
        - 商品相關
      summary: 3. 商品價格異動
      deprecated: true
      description: 即將取消！2024/10/7 起由「3.1 商品規格(sku)價格異動」(/VendorApi/GoodsdtPriceModify) 功能取代之。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - listGoodsPriceModify
              properties:
                listGoodsPriceModify:
                  type: array
                  description: 商品變價陣列
                  items:
                    type: object
                    required:
                      - goodsCode
                      - salePrice
                      - custPrice
                      - applyDate
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號
                      salePrice:
                        type: integer
                        description: 售價 (正整數)
                      custPrice:
                        type: integer
                        description: 市價 (正整數)
                      applyDate:
                        type: string
                        description: 商品價格生效日（格式支援 yyyyMMdd 或 yyyy-MM-dd 或 yyyy/MM/dd）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      required:
                        - goodsCode
                        - success
                        - method
                        - errorMessage
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        success:
                          type: boolean
                          description: 價格異動成功或失敗
                        method:
                          type: string
                          description: 此商品價格異動為新增或修改。新增 insert；修改 update
                          enum:
                            - insert
                            - update
                        errorMessage:
                          type: string
                          description: 價格異動失敗時的錯誤訊息
  /VendorApi/GoodsdtPriceModify:
    post:
      tags:
        - 商品相關
      summary: 3.1 商品規格(sku)價格異動
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - listItem
              properties:
                listItem:
                  type: array
                  description: 商品子品項變價陣列
                  items:
                    type: object
                    required:
                      - goodsCode
                      - goodsdtCode
                      - salePrice
                      - custPrice
                      - applyDate
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號
                      goodsdtCode:
                        type: string
                        description: 子品項編號
                      salePrice:
                        type: integer
                        description: 售價 (正整數)
                      custPrice:
                        type: integer
                        description: 市價 (正整數)
                      applyDate:
                        type: string
                        description: 商品價格生效日（格式支援 yyyyMMdd 或 yyyy-MM-dd 或 yyyy/MM/dd）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - listItem
                properties:
                  success:
                    type: boolean
                    description: 整體請求成功或失敗
                  errorMessage:
                    type: string
                    description: 整體請求失敗時的錯誤訊息
                  listItem:
                    type: array
                    description: 商品子品項資料陣列
                    items:
                      type: object
                      required:
                        - goodsCode
                        - goodsdtCode
                        - success
                        - method
                        - errorMessage
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        goodsdtCode:
                          type: string
                          description: 子品項編號
                        success:
                          type: boolean
                          description: 子品項價格異動成功或失敗
                        method:
                          type: string
                          description: 此商品子品項價格異動為新增或修改。新增 Insert；修改 Update
                          enum:
                            - Insert
                            - Update
                        errorMessage:
                          type: string
                          description: 子品項價格異動失敗時的錯誤訊息
  /VendorApi/GoodsStockModify:
    post:
      tags:
        - 商品相關
      summary: 4. 商品庫存量異動
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - listGoodsStockModify
              properties:
                listGoodsStockModify:
                  type: array
                  description: 商品庫存量異動陣列
                  items:
                    type: object
                    required:
                      - goodsCode
                      - goodsdtCode
                      - quantity
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號
                      goodsdtCode:
                        type: string
                        description: 單品編號流水碼 3 碼
                      quantity:
                        type: integer
                        description: 數量 (正整數)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      required:
                        - goodsCode
                        - goodsdtCode
                        - success
                        - errorMessage
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        goodsdtCode:
                          type: string
                          description: 單品編號流水碼 3 碼
                        success:
                          type: boolean
                          description: 庫存量異動成功或失敗
                        errorMessage:
                          type: string
                          description: 庫存量異動失敗時的錯誤訊息
  /VendorApi/GoodsQueryByMethod:
    post:
      tags:
        - 商品相關
      summary: 5. 商品查詢
      description: |
        因應商品子品項價格，`result` 層的 `salePrice` / `custPrice` / `applyDate` 即將取消，
        改由 `listGoodsdt` 內各子品項的同名欄位取代。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - queryMethod
                - saleStatus
                - pageIndex
                - maxPerPage
              properties:
                queryMethod:
                  type: string
                  description: |
                    要查詢的商品內容。
                    All：查詢商品上下架狀態、商品價格、商品庫存；
                    SaleType：只查詢商品上下架狀態；
                    Price：只查詢商品價格；
                    Stock：只查詢商品庫存量。
                    參數帶 All、Price 時，applyDate 為必填
                  enum:
                    - All
                    - SaleType
                    - Price
                    - Stock
                saleStatus:
                  type: string
                  description: |
                    上架或下架的商品。
                    All：查詢上架與下架的所有商品；
                    StartSelling：只查詢上架商品；
                    StopSelling：只查詢下架商品
                  enum:
                    - All
                    - StartSelling
                    - StopSelling
                pageIndex:
                  type: integer
                  description: 頁次 (最小值為 1)
                  minimum: 1
                maxPerPage:
                  type: integer
                  description: 每頁筆數 (最小值 100，最大值 10000)
                  minimum: 100
                  maximum: 10000
                applyDate:
                  type: string
                  description: 商品價格生效日（格式 yyyy-MM-dd HH:mm:ss）。查詢內容包含商品價格時為必填
                listGoods:
                  type: array
                  description: 查詢商品編號及單品編號陣列（未填時，將查詢符合其他條件的所有商品資料）
                  items:
                    type: object
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號（指定查詢某商品時必填）
                      listGoodsdtCode:
                        type: array
                        description: |
                          單品編號流水碼 3 碼陣列（指定查詢某單品編號時必填）。
                          未填時，將查詢該商品編號所有的單品編號資料
                        items:
                          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - requestQueryMethod
                  - requestSaleStatus
                  - totalGoods
                  - pageIndex
                  - maxPerPage
                  - result
                properties:
                  requestQueryMethod:
                    type: string
                    description: 請求的查詢內容
                    enum:
                      - All
                      - SaleType
                      - Price
                      - Stock
                  requestSaleStatus:
                    type: string
                    description: 請求的商品狀態
                    enum:
                      - All
                      - StartSelling
                      - StopSelling
                  totalGoods:
                    type: integer
                    description: 符合查詢條件的資料總筆數
                  pageIndex:
                    type: integer
                    description: 請求的頁次
                  maxPerPage:
                    type: integer
                    description: 請求的每頁筆數
                  result:
                    type: array
                    description: 回傳的商品資料
                    items:
                      type: object
                      required:
                        - success
                        - goodsCode
                        - goodsName
                        - saleStatus
                      properties:
                        success:
                          type: boolean
                          description: 查詢結果
                        errorMessage:
                          type: string
                          nullable: true
                          description: 錯誤訊息（success 為 false 時顯示）
                        goodsCode:
                          type: string
                          description: 商品編號
                        goodsName:
                          type: string
                          nullable: true
                          description: 商品名稱
                        saleStatus:
                          type: string
                          description: 商品上下架狀態
                          enum:
                            - StartSelling
                            - StopSelling
                        salePrice:
                          type: integer
                          nullable: true
                          description: 商品售價（因應商品子品項價格，此欄位將取消）。查詢內容包含商品價格時顯示，否則為 null
                        custPrice:
                          type: integer
                          nullable: true
                          description: 商品市價（因應商品子品項價格，此欄位將取消）。查詢內容包含商品價格時顯示，否則為 null
                        applyDate:
                          type: string
                          nullable: true
                          description: 商品價格生效日（因應商品子品項價格，此欄位將取消）。查詢內容包含商品價格時顯示，否則為 null
                        listGoodsdt:
                          type: array
                          nullable: true
                          description: 單品編號及單品庫存量陣列。查詢結果包含單品資訊時顯示，否則為 null
                          items:
                            type: object
                            required:
                              - dtSaleStatus
                            properties:
                              goodsdtCode:
                                type: string
                                nullable: true
                                description: 單品編號流水碼 3 碼
                              quantity:
                                type: integer
                                nullable: true
                                description: 單品庫存量
                              entpGoodsNo:
                                type: string
                                nullable: true
                                description: 商品原廠編號
                              goodsdtInfo:
                                type: string
                                nullable: true
                                description: 單品規格
                              salePrice:
                                type: integer
                                nullable: true
                                description: 商品售價（因應商品子品項價格新增）。查詢內容包含價格時顯示，否則為 null
                              custPrice:
                                type: integer
                                nullable: true
                                description: 商品市價（因應商品子品項價格新增）。查詢內容包含價格時顯示，否則為 null
                              applyDate:
                                type: string
                                nullable: true
                                description: 商品價格生效日（因應商品子品項價格新增）。查詢內容包含價格時顯示，否則為 null
                              dtSaleStatus:
                                type: string
                                description: 單品啟用/停用狀態。on：啟用、off：停用
                                enum:
                                  - 'on'
                                  - 'off'
  /apiv2/VendorApi/TempGoodsmodify:
    post:
      tags:
        - 商品相關
      summary: 6. 新增商品&編輯暫存商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TempGoodsModifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsUpsertResponse'
  /apiv2/VendorApi/GoodsModify:
    post:
      tags:
        - 商品相關
      summary: 7. 已上架商品資料編輯
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsModifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsUpsertResponse'
  /apiv2/VendorApi/FileUpload:
    post:
      tags:
        - 商品相關
      summary: 8. 圖檔上傳
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    檔案。請勿上傳超過 1M，建議上傳 jpg 圖檔。
                    目前素材空間圖檔總上限為 10GB，可透過 /apiv2/VendorApi/FileQuote 查詢剩餘額度，
                    也可透過 /apiv2/VendorApi/FileBatchRemove 批次刪除未引用的素材/圖檔來釋放空間
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - errorMessage
                  - data
                properties:
                  success:

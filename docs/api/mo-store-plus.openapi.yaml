      summary: 2. 宅配出貨確認
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listItem:
                  type: array
                  description: 訂單項變價陣列
                  items:
                    type: object
                    properties:
                      orderNo:
                        type: string
                        description: 訂單編號
                      orderSeq:
                        type: string
                        description: 訂單品項流水號
                      shipPack:
                        type: string
                        description: 出貨包材
                      packType:
                        type: string
                        description: 包材類型
                      packUnit:
                        type: string
                        description: 包材重量(公克)
                      deliveryStatus:
                        type: string
                        description: 配送狀態（必填；Shipped：已配送/可出貨；PhoneUnreachable：電聯不上；ScheduledDeliveryDate：指定配送日；ContactedPendingDate：已電聯、尚未確認配送日期；AdditionalPurchasePending：需配送加購協調中；CancelNoStockOrder：無貨取消訂單；WrongInfoOrInvalidArea：收件資料有誤/不配送地區；StoreNote：商店備註）
                      deliveryDate:
                        type: string
                        description: 指定配送日（非必填；格式 YYYY-MM-dd；deliveryStatus 為 ScheduledDeliveryDate 時必填）
                      deliveryNote:
                        type: string
                        description: 配送訊息（必填；可為空字串）
                      deliveryCompany:
                        type: string
                        description: 物流公司（必填；Pelican：宅配通；HCT：新竹貨運；TCAT：統一速達；KerryTJ：大榮貨運；Migo：東元物流；SFExpress：順豐速運；OtherCourier：其他宅配；PostOffice：郵局；Maple：便利帶；Other：其他）
                      deliveryNo:
                        type: string
                        description: 配送單號（必填）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeliveryConfirmationResponse'

openapi: 3.0.3
info:
  title: momo 店+後台管理系統 - 廠商 API
  version: 0.11.0
  description: 完整萃取自規格書的 API 呼叫與回傳格式
servers:
  - url: https://api3p.momo.com.tw
    description: momo 店+廠商 API 伺服器
components:
  schemas:
    GoodsSaleStatusRequest:
      type: object
      properties:
        listGoodsCode:
          type: array
          description: 商品編號陣列
          items:
            type: string
    GoodsUpsertRequest:
      type: object
      properties:
        goodsCode:
          type: string
          description: 商品編號 (如有值，表示為暫存品的編輯)
        webBrandNo:
          type: string
          description: 商品品牌編號
        webBrandSeries:
          type: string
          description: 品牌系列
        goodsName:
          type: string
          description: 商品名稱
        categoryCode:
          type: string
          description: 分類編號
        nsTaxDone:
          type: boolean
          description: 是否應免稅
        freeShipping:
          type: boolean
          description: 是否免運費
        freeShippingYn:
          type: string
          description: 是否免運費（已上架商品編輯使用；必填；0：否、1：是；商品費用由商店全額負擔）
        categoryByEntpCodeList:
          type: array
          description: 商店分類多個
          items:
            type: string
        inspectionParam:
          type: object
          description: 檢驗報告書
          properties:
            inspectionEffectiveDate:
              type: string
              description: 檢驗報告書開始時間
            inspectionExpiredDate:
              type: string
              description: 檢驗報告書結束時間
            inspectionFileIdList:
              type: array
              description: 檢驗報告書圖檔
              items:
                type: string
        asYn:
          type: boolean
          description: 是否有售後保固
        asTerm:
          type: string
          description: 保固(維修)天數
        asNote:
          type: string
          description: 保固內容
        delyTemp:
          type: string
          description: 配送溫層 (normalTemperature/frozen/refrigerated)
        volumeType:
          type: string
          description: 材積類型 (outerBoxSize/volumeSpacing)
        length:
          type: string
          description: 長度
        width:
          type: string
          description: 寬度
        height:
          type: string
          description: 高度
        weight:
          type: number
          description: 重量
        volume:
          type: string
          description: 材積級距
        logisticsNoList:
          type: array
          description: 配送物流方式設定
          items:
            type: string
        realLogisticsNo:
          type: string
          description: 物流運費編號
        outplaceSeq:
          type: string
          description: 出貨地代碼
        skuParamList:
          type: array
          description: 規格列表
          items:
            type: object
            properties:
              goodsdtInfo1:
                type: string
                description: 規格一值
              goodsdtInfo2:
                type: string
                description: 規格二值
              goodsDtCode:
                type: string
                description: 商品子品項編號（既有規格必填且須依原規格順序填寫；新增規格可不填；可由 /VendorApi/GoodsQueryByMethod 查詢）
              saleGb:
                type: string
                description: 規格狀態（必填；on：啟用；off：停用）
              entpGoodsNo:
                type: string
                description: 供應商原廠貨號
              internationalNo:
                type: string
                description: 國際條碼
              canSaleQty:
                type: string
                description: 庫存量
              salePrice:
                type: string
                description: 售價
              custPrice:
                type: string
                description: 市價
              imgFileId:
                type: string
                description: 圖檔 id
        pcertDescribeParam:
          type: array
          description: 相關認證字號
          items:
            type: object
            properties:
              proChkCode:
                type: string
                description: 商檢字號
              nccChkCode:
                type: string
                description: NCC 字號
              energyLabel:
                type: string
                description: 能源效率分級
              pcertImgId:
                type: string
                description: 附件圖片 id
        sizeParam:
          type: array
          description: 尺寸參數
          items:
            type: object
            properties:
              type:
                type: string
                description: 尺寸類型
              unit:
                type: string
                description: 單位
              clothingSizesParamList:
                type: array
                items:
                  type: array
                  items:
                    type: string
              clothingTrysParamList:
                type: array
                items:
                  type: array
                  items:
                    type: string
        goodsAttrParamList:
          type: array
          description: 規格屬性列表
          items:
            type: object
            properties:
              goodsAttrId:
                type: string
                description: 商品屬性主檔編號
              indexNo:
                type: string
                description: 商品屬性分群編號
              indexItemNoList:
                type: array
                description: 商品屬性分群內容編號
                items:
                  type: string
        goodsNote:
          type: string
          description: 商品規格描述
        goodsDescribeParamList:
          type: array
          description: 商品特色頁描述
          items:
            type: object
            properties:
              type:
                type: string
                description: 類型 (slogan/nevin)
              content:
                type: string
                description: 内容
        youtubeLink:
          type: string
          description: Youtube ID
        goodsImgIdList:
          type: array
          description: 商品主圖 id 列表
          items:
            type: string
        adImgFileId:
          type: string
          description: 商品廣告圖 id
        exportImgFileIdList:
          type: array
          description: 商品特色（專推）-圖檔
          items:
            type: string
        youtubeLinkList:
          type: string
          description: 商品特色（專推）- 商品影音
        htmlEditor:
          type: string
          description: 專推
        envMedicineParam:
          type: object
          description: 環境用藥信息
          properties:
            envMedicineCode:
              type: string
              description: 環境用藥許可證字號
            envMedicineEntpName:
              type: string
              description: 廠商名稱
            envMedicineChkCode:
              type: string
              description: 環境用藥販賣許可證
        recycleItem:
          type: string
          description: 回收項目(大型家電)
        mountYn:
          type: boolean
          description: 大型家電是否含安裝
        nsAppShippingDone:
          type: boolean
          description: 是否為約定送貨
        onType:
          type: string
          description: 商品上架方式 (now/time)
        startDate:
          type: string
          description: 開始時間
        endDate:
          type: string
          description: 結束時間
        colName1:
          type: string
          description: 規格一名
        colName2:
          type: string
          description: 規格二名
    GoodsUpsertResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 上架成功或失敗
        errorMessage:
          type: string
          description: 上架失敗時的錯誤訊息
        data:
          type: string
          description: 商品編號
    OrderDeliveryConfirmationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 整體請求成功或失敗
        errorMessage:
          type: string
          description: 整體請求失敗時的錯誤訊息
        confirmDeliveryDetailResList:
          type: array
          description: 確認結果明細
          items:
            type: object
            properties:
              orderNo:
                type: string
                description: 訂單編號
              orderSeq:
                type: string
                description: 訂單品項流水號
              success:
                type: boolean
                description: 是否成功
              message:
                type: string
                description: 信息
    ConvenienceStoreDeliveryConfirmationRequest:
      type: object
      properties:
        delyGb:
          type: string
          description: 超取類型
        listItem:
          type: array
          description: 訂單項變價陣列
          items:
            type: object
            properties:
              newBoxYn:
                type: string
                description: 倂箱號
              deliveryStatus:
                type: string
                description: 配送狀態
              deliveryNote:
                type: string
                description: 配送訊息
              shipPack:
                type: string
                description: 出貨包材
              packType:
                type: string
                description: 包材類型
              packUnit:
                type: string
                description: 包材重量(公克)
              orderList:
                type: array
                description: 訂單列表
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: 訂單編號
                    orderSeq:
                      type: string
                      description: 訂單品項流水號
    ConvenienceStoreDeliveryConfirmationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 整體請求成功或失敗
        errorMessage:
          type: string
          description: 整體請求失敗時的錯誤訊息
        confirmDeliveryDetailResList:
          type: array
          description: 確認結果明細
          items:
            type: object
            properties:
              newBoxYn:
                type: string
                description: 倂箱號
              slipNo:
                type: string
                description: 物流單號
              deliveryStatus:
                type: string
                description: 配送狀態
              deliveryNote:
                type: string
                description: 配送訊息
              printLable:
                type: string
                description: 列印標籤
              printDetail:
                type: string
                description: 列印明細
              orderList:
                type: array
                description: 訂單列表
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: 訂單編號
                    orderSeq:
                      type: string
                      description: 訂單品項流水號
              success:
                type: boolean
                description: 是否成功
              message:
                type: string
                description: 信息
    ConvenienceStoreLabelRequest:
      type: object
      properties:
        listItem:
          type: array
          description: 訂單陣列
          items:
            type: object
            properties:
              delyGb:
                type: integer
                description: 超取類型
              orderList:
                type: array
                description: 訂單列表
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: 訂單編號
                    orderSeq:
                      type: string
                      description: 訂單品項流水號
    ConvenienceStoreLabelResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 整體請求成功或失敗
        errorMessage:
          type: string
          description: 整體請求失敗時的錯誤訊息
        orderPrintLabelResList:
          type: array
          description: 確認結果明細
          items:
            type: object
            properties:
              printLable:
                type: string
                description: 列印標籤
              printDetail:
                type: string
                description: 列印明細
              printAll:
                type: string
                description: 列印出貨總表
              orderList:
                type: array
                description: 訂單列表
                items:
                  type: object
                  properties:
                    orderNo:
                      type: string
                      description: 訂單編號
                    orderSeq:
                      type: string
                      description: 訂單品項流水號
              message:
                type: string
                description: 信息
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
paths:
  /VendorApi/GoodsStartSelling:
    post:
      tags:
        - 商品相關
      summary: 1. 商品上架
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsSaleStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        success:
                          type: boolean
                          description: 上架成功或失敗 (true / false)
                        errorMessage:
                          type: string
                          description: 上架失敗時的錯誤訊息
  /VendorApi/GoodsStopSelling:
    post:
      tags:
        - 商品相關
      summary: 2. 商品下架
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsSaleStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        success:
                          type: boolean
                          description: 下架成功或失敗 (true / false)
                        errorMessage:
                          type: string
                          description: 下架失敗時的錯誤訊息
  /VendorApi/GoodsPriceModify:
    post:
      tags:
        - 商品相關
      summary: 3. 商品價格異動
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listGoodsPriceModify:
                  type: array
                  description: 商品變價陣列
                  items:
                    type: object
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號
                      salePrice:
                        type: integer
                        description: 售價 (正整數)
                      custPrice:
                        type: integer
                        description: 市價 (正整數)
                      applyDate:
                        type: string
                        description: 商品價格生效日 (yyyy-MM-dd)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        success:
                          type: boolean
                          description: 價格異動成功或失敗
                        method:
                          type: string
                          description: 此商品價格異動為新增或修改 (insert/update)
                        errorMessage:
                          type: string
                          description: 價格異動失敗時的錯誤訊息
  /VendorApi/GoodsdtPriceModify:
    post:
      tags:
        - 商品相關
      summary: 3.1 商品規格(sku)價格異動
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listItem:
                  type: array
                  description: 商品子品項變價陣列
                  items:
                    type: object
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號
                      goodsdtCode:
                        type: string
                        description: 子品項編號
                      salePrice:
                        type: integer
                        description: 售價 (正整數)
                      custPrice:
                        type: integer
                        description: 市價 (正整數)
                      applyDate:
                        type: string
                        description: 商品價格生效日
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: 整體請求成功或失敗
                  errorMessage:
                    type: string
                    description: 整體請求失敗時的錯誤訊息
                  listItem:
                    type: array
                    description: 商品子品項資料陣列
                    items:
                      type: object
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        goodsdtCode:
                          type: string
                          description: 子品項編號
                        success:
                          type: boolean
                          description: 子品項價格異動成功或失敗
                        method:
                          type: string
                          description: 此商品子品項價格異動為新增或修改 (Insert/Update)
                        errorMessage:
                          type: string
                          description: 子品項價格異動失敗時的錯誤訊息
  /VendorApi/GoodsStockModify:
    post:
      tags:
        - 商品相關
      summary: 4. 商品庫存量異動
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                listGoodsStockModify:
                  type: array
                  description: 商品庫存量異動陣列
                  items:
                    type: object
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號
                      goodsdtCode:
                        type: string
                        description: 單品編號流水碼 3 碼
                      quantity:
                        type: integer
                        description: 數量 (正整數)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    description: 資料陣列
                    items:
                      type: object
                      properties:
                        goodsCode:
                          type: string
                          description: 商品編號
                        goodsdtCode:
                          type: string
                          description: 單品編號流水碼 3 碼
                        success:
                          type: boolean
                          description: 庫存量異動成功或失敗
                        errorMessage:
                          type: string
                          description: 庫存量異動失敗時的錯誤訊息
  /VendorApi/GoodsQueryByMethod:
    post:
      tags:
        - 商品相關
      summary: 5. 商品查詢
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                queryMethod:
                  type: string
                  description: 要查詢的商品內容 (All/SaleType/Price/Stock)
                saleStatus:
                  type: string
                  description: 上架或下架的商品 (All/StartSelling/StopSelling)
                pageIndex:
                  type: integer
                  description: 頁次 (最小值為 1)
                maxPerPage:
                  type: integer
                  description: 每頁筆數 (100~10000)
                applyDate:
                  type: string
                  description: 商品價格生效日 (yyyy-MM-dd HH:mm:ss)
                listGoods:
                  type: array
                  description: 查詢商品編號及單品編號陣列
                  items:
                    type: object
                    properties:
                      goodsCode:
                        type: string
                        description: 商品編號
                      listGoodsdtCode:
                        type: array
                        description: 單品編號流水碼 3 碼陣列
                        items:
                          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestQueryMethod:
                    type: string
                    description: 請求的查詢內容
                  requestSaleStatus:
                    type: string
                    description: 請求的商品狀態
                  totalGoods:
                    type: integer
                    description: 符合查詢條件的資料總筆數
                  pageIndex:
                    type: integer
                    description: 請求的頁次
                  maxPerPage:
                    type: integer
                    description: 請求的每頁筆數
                  result:
                    type: array
                    description: 回傳的商品資料
                    items:
                      type: object
                      properties:
                        success:
                          type: boolean
                          description: 查詢結果
                        errorMessage:
                          type: string
                          description: 錯誤訊息
                        goodsCode:
                          type: string
                          description: 商品編號
                        goodsName:
                          type: string
                          description: 商品名稱
                        saleStatus:
                          type: string
                          description: 商品上下架狀態
                        salePrice:
                          type: integer
                          description: 商品售價 (因應商品子品項價格，此欄位將取消)
                        custPrice:
                          type: integer
                          description: 商品市價 (將取消)
                        applyDate:
                          type: string
                          description: 商品價格生效日 (將取消)
                        listGoodsdt:
                          type: array
                          description: 單品編號及單品庫存量陣列
                          items:
                            type: object
                            properties:
                              goodsdtCode:
                                type: string
                                description: 單品編號流水碼 3 碼
                              quantity:
                                type: integer
                                description: 單品庫存量
                              entpGoodsNo:
                                type: string
                                description: 商品原廠編號
                              goodsdtInfo:
                                type: string
                                description: 單品規格
                              salePrice:
                                type: integer
                                description: 商品售價
                              custPrice:
                                type: integer
                                description: 商品市價
                              applyDate:
                                type: string
                                description: 商品價格生效日
                              dtSaleStatus:
                                type: string
                                description: 單品啟用/停用狀態 (on/off)
  /apiv2/VendorApi/TempGoodsmodify:
    post:
      tags:
        - 商品相關
      summary: 6. 新增商品&編輯暫存商品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsUpsertResponse'
  /apiv2/VendorApi/GoodsModify:
    post:
      tags:
        - 商品相關
      summary: 7. 已上架商品資料編輯
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoodsUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoodsUpsertResponse'
  /apiv2/VendorApi/FileUpload:
    post:
      tags:
        - 商品相關
      summary: 8. 圖檔上傳
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 檔案 (請勿上傳超過 1M)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:

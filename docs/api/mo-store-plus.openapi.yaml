  /VendorApi/OrderRecover:
    post:
      tags:
        - 訂單相關
      summary: 5. 商品回收確認
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delyWay
                - listItem
              properties:
                delyWay:
                  type: string
                  description: 退貨方式。1：宅配、2：超商、3：第三方物流
                  enum:
                    - '1'
                    - '2'
                    - '3'
                listItem:
                  type: array
                  description: 訂單項變價陣列（運費可不用提供）
                  items:
                    type: object
                    required:
                      - orderNo
                      - orderSeq
                      - delayType
                    properties:
                      orderNo:
                        type: string
                        description: 訂單編號
                      orderSeq:
                        type: string
                        description: 訂單品項流水號
                      delayType:
                        type: string
                        description: |
                          回收狀態。
                          Recover：已回收；
                          PhoneUnreachable：電聯不上（限宅配使用）；
                          ScheduledRecoverDate：指定回收日（限宅配使用）；
                          RecoverError：客戶回收異常；
                          GoodsCheck：商品回收檢查中；
                          StoreNote：商家備註
                        enum:
                          - Recover
                          - PhoneUnreachable
                          - ScheduledRecoverDate
                          - RecoverError
                          - GoodsCheck
                          - StoreNote
                      smRecoverDate:
                        type: string
                        description: 指定回收日（格式 YYYY-MM-dd；限宅配使用）
                      recoverNote:
                        type: string
                        description: 備註訊息（限宅配回收使用）
                      msgNote:
                        type: string
                        description: 備註訊息
                      deliveryCompany:
                        type: string
                        description: |
                          物流公司（限 宅配 及 超取倉到店-客未取退回 使用）。
                          Pelican：宅配通；HCT：新竹貨運；TCAT：統一速達；KerryTJ：大榮貨運；Migo：東元物流；
                          SFExpress：順豐速運；OtherCourier：其他宅配；PostOffice：郵局；Maple：便利帶；Other：其他
                        enum:
                          - Pelican
                          - HCT
                          - TCAT
                          - KerryTJ
                          - Migo
                          - SFExpress
                          - OtherCourier
                          - PostOffice
                          - Maple
                          - Other
                      deliveryNo:
                        type: string
                        description: 配送單號（限 宅配 及 超取倉到店-客未取退回 使用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeliveryConfirmationResponse'

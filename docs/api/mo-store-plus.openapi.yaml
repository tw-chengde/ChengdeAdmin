  /VendorApi/OrderQuery:
    post:
      tags:
        - 訂單相關
      summary: 1. 訂單查詢
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pageIndex
                - maxPerPage
                - queryDateType
                - fromDate
                - toDate
                - deliveryType
                - orderStatus
              properties:
                pageIndex:
                  type: integer
                  description: 頁次 (最小值為 1)
                  minimum: 1
                maxPerPage:
                  type: integer
                  description: 每頁筆數 (最小值 100，最大值 10000)
                  minimum: 100
                  maximum: 10000
                listOrderNo:
                  type: array
                  description: |
                    訂單編號字串陣列。當此陣列有值時，則無視其他條件（指定訂單編號查詢）。
                    支援 14 碼訂單編號（例：64032500051951），也支援 18 碼訂單編號-流水碼（例：64032500051951-001）。
                    不支援模糊查詢。使用此欄位查詢時，預設查詢 360 日內訂單
                  items:
                    type: string
                queryDateType:
                  type: string
                  description: |
                    查詢日期區間類別（擇一）。
                    OrderDate：訂單日期；
                    ShipDate：出貨日期；
                    RecycleDate：回收日期；
                    LastShipDate：最晚出貨日期；
                    EntpReturnDate：廠商退貨日期
                  enum:
                    - OrderDate
                    - ShipDate
                    - RecycleDate
                    - LastShipDate
                    - EntpReturnDate
                fromDate:
                  type: string
                  description: 查詢起始日期（起迄日期最大區間 30 日。格式：20240301 或 2024/03/01 或 2024-03-01）
                toDate:
                  type: string
                  description: 查詢迄止日期（起迄日期最大區間 30 日。格式：20240301 或 2024/03/01 或 2024-03-01）
                deliveryType:
                  type: string
                  description: |
                    配送類型（擇一）。
                    All：全部；Home：宅配；Store：超取；ThirdParty：第三方物流
                  enum:
                    - All
                    - Home
                    - Store
                    - ThirdParty
                storeDeliveryType:
                  type: string
                  description: |
                    超取分類。當 deliveryType 為 Store 時必填；當 deliveryType 為 All 時，此條件自動為 All 且需必填。
                    All：全部；
                    StoreToStoreShip：店到店配送；
                    StoreToStoreReturn：店到店退貨；
                    WarehouseToStoreShip：倉到店配送；
                    StoreToWarehouseReturn：店到倉退貨
                  enum:
                    - All
                    - StoreToStoreShip
                    - StoreToStoreReturn
                    - WarehouseToStoreShip
                    - StoreToWarehouseReturn
                orderStatus:
                  type: string
                  description: |
                    訂單狀態（擇一）。
                    All：全部；Unpaid：未付款；NotShipped：未出貨(未印單)；NotRecycled：未回收；
                    Printed：已印單；Shipping：配送中；DoneDelivery：配送結束；AbnormalDelivery：配送異常；
                    OrderCancelled：取消訂單；ReturnCancelled：取消退貨；RecycleConfirmed：回收確認。

                    查詢日期區間類別對應可顯示的訂單狀態：
                    OrderDate、LastShipDate 支援所有訂單狀態；
                    ShipDate 支援出貨訂單的狀態；
                    RecycleDate 支援回收訂單的狀態；
                    EntpReturnDate 支援廠商退貨訂單的狀態
                  enum:
                    - All
                    - Unpaid
                    - NotShipped
                    - NotRecycled
                    - Printed
                    - Shipping
                    - DoneDelivery
                    - AbnormalDelivery
                    - OrderCancelled
                    - ReturnCancelled
                    - RecycleConfirmed
                goodsNo:
                  type: string
                  description: 商品編號（支援模糊查詢）
                goodsName:
                  type: string
                  description: 商品名稱（支援模糊查詢）
                entpGoodsNo:
                  type: string
                  description: 商品原廠編號（支援模糊查詢）
                customerName:
                  type: string
                  description: 訂購人姓名（支援模糊查詢）
                orderChangeAddrStatus:
                  type: string
                  description: |
                    更換地址的狀態。
                    toBeChanged：查詢申請更換地址的訂單；
                    changed：查詢新地址（已同意更換地址）的訂單；
                    notChanged：查詢原地址（拒絕更換地址／或無申請更換地址）的訂單；
                    All：查詢所有訂單，包含沒申請過更換地址的訂單
                  enum:
                    - toBeChanged
                    - changed
                    - notChanged
                    - All
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - pageIndex
                  - maxPerPage
                  - totalOrders
                  - listOrder
                properties:
                  errorMessage:
                    type: string
